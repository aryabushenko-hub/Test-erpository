<title>КП-Конструктор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: инженерный рабочий стол — шаги слева, рабочая область по центру, подсказки справа; на телефоне всё в одну колонку */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16202a; --muted:#5a6775; --line:#d5dce3;
  --accent:#1f56b3; --accent-ink:#ffffff; --accent-soft:#e3ecfa;
  --ai:#6a45c2; --ai-soft:#efe9fb;
  --ok:#1c7a45; --ok-soft:#e2f3e9; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --font-ui:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface-2:#1c2632; --ink:#e3e9ef; --muted:#93a1b0; --line:#2b3744;
  --accent:#6f9cec; --accent-ink:#0b1220; --accent-soft:#1d2c45;
  --ai:#a88cf5; --ai-soft:#2a2342;
  --ok:#55c487; --ok-soft:#18321f; --warn:#e3a73c; --warn-soft:#3a2d12; --bad:#f07a70; --bad-soft:#3d1c1a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface-2:#1c2632; --ink:#e3e9ef; --muted:#93a1b0; --line:#2b3744;
  --accent:#6f9cec; --accent-ink:#0b1220; --accent-soft:#1d2c45;
  --ai:#a88cf5; --ai-soft:#2a2342;
  --ok:#55c487; --ok-soft:#18321f; --warn:#e3a73c; --warn-soft:#3a2d12; --bad:#f07a70; --bad-soft:#3d1c1a;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:6px 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand span{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tname{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--ok)} .pill.off .dot{background:var(--bad)}
.demo{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.demo p{margin:0;flex:1;min-width:240px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:18px;align-items:start}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
nav.steps button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--radius);color:var(--ink)}
nav.steps button:hover{background:var(--surface)}
nav.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.steps button.cur{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
nav.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--font-mono);border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
nav.steps button.cur .n{border-color:var(--accent);color:var(--accent)}
nav.steps button.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
nav.steps small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card+.card{margin-top:14px}
h1{font-size:21px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
aside.hints{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
aside.hints h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 8px}
aside.hints ul{margin:0;padding-left:18px;display:grid;gap:8px}
aside.hints .tip{margin-top:12px;padding:10px;border-radius:var(--radius);background:var(--surface-2);font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn{font:500 13px var(--font-ui);cursor:pointer;border-radius:5px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px}
.drops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:6px;background:var(--surface-2);cursor:pointer;position:relative}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:14px}
.drop .fmt{font:12px var(--font-mono);color:var(--muted)}
.drop .got{font-size:13px;color:var(--ok);word-break:break-word}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);max-height:62vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);white-space:nowrap}
tr.sec td{background:var(--surface-2);font-weight:600}
tr.hdr td{background:var(--accent-soft)}
td.rn{color:var(--muted);font:12px var(--font-mono)}
tr.st-ok td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.st-ai td:first-child{box-shadow:inset 3px 0 0 var(--ai)}
tr.st-check td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.st-empty td:first-child{box-shadow:inset 3px 0 0 var(--line)}
input.cell{width:96px;text-align:right;font-family:var(--font-mono);padding:4px 6px;font-size:13px}
.sug{border:1px solid color-mix(in srgb,var(--ai) 40%,transparent);background:var(--ai-soft);border-radius:5px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px}
.sug.similar{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)} .sug.similar .t{color:var(--warn)}
.sug .row{margin-left:auto}
tr.has-sug td{border-bottom:0} tr.sugrow td{padding-top:0}
.sug .t{color:var(--ai);font-weight:600}
.sug .s{color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-ai{background:var(--ai-soft);color:var(--ai)} .b-mute{background:var(--surface-2);color:var(--muted)}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--surface-2)}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font:600 18px var(--font-mono);font-variant-numeric:tabular-nums;word-break:break-word}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--bad)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius)}
.req{display:grid;gap:6px}
.req h4{margin:10px 0 2px;font-size:13px;color:var(--accent)}
.req div{padding:6px 10px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 4px 4px 0}
.req div small{color:var(--muted);font-family:var(--font-mono)}
.answer{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;margin-top:8px;font-size:13px}
.pages{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto}
.pages label{display:inline-flex;gap:4px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface-2)}
canvas.pv{max-width:100%;border:1px solid var(--line);border-radius:4px;margin-top:8px;background:#fff}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:440px;width:100%}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
@media (max-width:1180px){.layout{grid-template-columns:210px minmax(0,1fr)} aside.hints{grid-column:2;position:static}}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)} aside.hints{grid-column:1}
  nav.steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  nav.steps button{grid-template-columns:24px auto;white-space:nowrap} nav.steps small{display:none}
  .grid2,.drops{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>КП-Конструктор</b><span>прототип v0.1</span></div>
    <div class="tname" id="tname"></div>
    <span class="pill" id="aiPill"><span class="dot"></span><span id="aiTxt">ИИ: проверка…</span></span>

  <div class="demo" id="demoBar" hidden>
    <p><b>Открыт демо-пример.</b> Ведомость и база прошлых КП — учебные, цены в них условные и не являются рыночными. Чтобы проверить на своих данных, нажмите «Новый тендер» и загрузите файлы.</p>
  </div>
  <div class="layout">

</div>
<div class="modal" id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
"use strict";
/* ================= утилиты ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf2 = new Intl.NumberFormat("ru-RU", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nf0 = new Intl.NumberFormat("ru-RU", {maximumFractionDigits: 3});
const money = v => nf2.format(v || 0);
const qtyf = v => nf0.format(v || 0);
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : NaN;
  if (v == null) return NaN;
  const s = String(v).replace(/[\s ]/g, "").replace(",", ".");
  if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
function ab2b64(buf) { let s = ""; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
const colName = c => XLSX.utils.encode_col(c);

/* ================= единицы измерения (детерминированно) ================= */
function unitCanon(u) {
  let s = String(u || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, "");
  let mult = 1;
  const m = s.match(/^(\d+)(.+)$/);
  if (m) { mult = +m[1]; s = m[2]; }
  const map = [
    [/^(м2|м²|кв\.?м\.?|м\.?кв\.?|квм)$/, "м²"], [/^(м3|м³|куб\.?м\.?|м\.?куб\.?)$/, "м³"],
    [/^(м|м\.|п\.?м\.?|м\.?п\.?|пог\.?м\.?|метр|метров)$/, "м"], [/^(шт|шт\.|штук|штука)$/, "шт"],
    [/^(т|т\.|тн|тонн|тонна)$/, "т"], [/^(кг|кг\.)$/, "кг"], [/^(компл|компл\.|к-т|комплект|кмпл)$/, "компл"]
  ];
  for (const [re, c] of map) if (re.test(s)) return {u: c, mult};
  return {u: s || "—", mult};
}
/* множитель: цена кандидата × factor = цена за единицу позиции; null — пересчёт неизвестен */
function unitFactor(posUnit, candUnit) {
  const a = unitCanon(posUnit), b = unitCanon(candUnit);
  if (a.u === b.u) return a.mult / b.mult;
  if (a.u === "т" && b.u === "кг") return 1000 * a.mult / b.mult;
  if (a.u === "кг" && b.u === "т") return a.mult / b.mult / 1000;
  return null;
}

/* ================= текстовое сходство (для отбора кандидатов) ================= */
function toks(s) {
  s = String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[ø⌀]/g, " д ")
    .replace(/(\d),(\d)/g, "$1.$2").replace(/(\d)\s*[хx×*]\s*(\d)/g, "$1 x $2")
    .replace(/([a-zа-я])\.?(?=\d)/g, "$1 ").replace(/(\d)(?=[a-zа-я])/g, "$1 ");
  const out = new Set();
  for (const w of s.split(/[^a-zа-я0-9.]+/)) {
    const t = w.replace(/^\.+|\.+$/g, "");
    if (!t) continue;
    if (/\d/.test(t)) out.add(t);
    else if (t.length > 2) out.add(t.slice(0, 5));
  }
  return out;
}
function sim(a, b) {
  if (!a.size || !b.size) return 0;
  let inter = 0, numA = 0, numHit = 0;
  for (const t of a) { if (b.has(t)) inter++; if (/\d/.test(t)) { numA++; if (b.has(t)) numHit++; } }
  let s = 2 * inter / (a.size + b.size);
  if (numA) s = s * 0.8 + 0.2 * (numHit / numA);
  return s;
}

/* ================= разбор таблиц ================= */
const FIELDS = [
  ["num", "№ п/п"], ["name", "Наименование"], ["unit", "Ед. изм."], ["qty", "Количество"],
  ["pw", "Цена работ за ед."], ["pm", "Цена материалов за ед."], ["price", "Цена за ед. (общая)"], ["sum", "Сумма"]
];
function sheetRows(ws) {
  if (!ws || !ws["!ref"]) return {rows: [], r0: 0, c0: 0};
  const rg = XLSX.utils.decode_range(ws["!ref"]);
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: "", blankrows: true});
  return {rows, r0: rg.s.r, c0: rg.s.c};
}
function classify(label) {
  const L = String(label).toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ");
  if (/(цен|стоим|расцен).*(работ|монтаж|смр)|(работ|монтаж).*(цен|стоим)/.test(L)) return "pw";
  if (/(цен|стоим).*(матер|оборуд)|(матер|оборуд).*(цен|стоим)/.test(L)) return "pm";
  if (/наимен|вид(ы)? работ|описани|позици[яи] работ/.test(L)) return "name";
  if (/ед\.? ?изм|^ед\.?$|единиц/.test(L)) return "unit";
  if (/кол-?во|количеств|объем/.test(L)) return "qty";
  if (/сумм|всего|итого|общая стоимость/.test(L)) return "sum";
  if (/цена|стоимость.*ед|расценк|стоимость/.test(L)) return "price";
  if (/^№|п\/п|^поз/.test(L)) return "num";
  return null;
}
function detectLayout(rows) {
  let best = -1, bestScore = 0;
  for (let r = 0; r < Math.min(rows.length, 40); r++) {
    const seen = new Set();
    for (const c of rows[r] || []) { const k = typeof c === "string" ? classify(c) : null; if (k) seen.add(k); }
    const sc = seen.size + (seen.has("name") ? 2 : 0) + (seen.has("qty") ? 1 : 0);
    if (sc > bestScore) { bestScore = sc; best = r; }
  }
  if (best < 0 || bestScore < 4) return null;
  const width = Math.max(...rows.slice(best, best + 3).map(r => (r || []).length), 0);
  const labels = [];
  const next = rows[best + 1] || [];
  const nextIsText = next.filter(c => typeof c === "string" && /[a-zа-я]/i.test(c)).length >= 2;
  for (let c = 0; c < width; c++) labels[c] = String((rows[best] || [])[c] ?? "") + (nextIsText ? " " + String(next[c] ?? "") : "");
  const map = {};
  labels.forEach((l, c) => { const k = classify(l); if (k && map[k] == null) map[k] = c; });
  let start = best + (nextIsText ? 2 : 1);
  const isNumbering = r => { const v = (rows[r] || []).filter(x => x !== ""); return v.length >= 3 && v.every((x, i) => num(x) === i + 1); };
  if (isNumbering(start)) start++;
  return {headerRow: best, dataStart: start, map};
}
function extractPositions(rows, lay) {
  const m = lay.map, out = [];
  let section = "", id = 0;
  for (let r = lay.dataStart; r < rows.length; r++) {
    const row = rows[r] || [];
    const name = String(row[m.name] ?? "").trim();
    if (!name) continue;
    if (/^(итого|всего|ндс)/i.test(name)) continue;
    const qty = m.qty != null ? num(row[m.qty]) : NaN;
    const unit = m.unit != null ? String(row[m.unit] ?? "").trim() : "";
    if (!(qty > 0)) { if (!unit && name.length < 220) { section = name; out.push({type: "sec", name, row: r}); } continue; }
    const g = k => (m[k] != null ? num(row[m[k]]) : NaN);
    let pw = g("pw"), pm = g("pm");
    if (isNaN(pw) && isNaN(pm) && !isNaN(g("price"))) pw = g("price");
    out.push({type: "pos", id: "p" + (++id), row: r, num: m.num != null ? String(row[m.num] ?? "") : String(id), name, unit, qty, section,
      pw: isNaN(pw) ? null : pw, pm: isNaN(pm) ? null : pm, status: (!isNaN(pw) || !isNaN(pm)) ? "ok" : "empty", src: (!isNaN(pw) || !isNaN(pm)) ? "из файла" : ""});
  }
  return out;
}
function historyFromRows(rows, lay, fileName) {
  const m = lay.map, out = [];
  for (let r = lay.dataStart; r < rows.length; r++) {
    const row = rows[r] || [];
    const name = String(row[m.name] ?? "").trim();
    if (!name || /^(итого|всего|ндс)/i.test(name)) continue;
    const g = k => (m[k] != null ? num(row[m[k]]) : NaN);
    let pw = g("pw"), pm = g("pm"), split = true;
    if (isNaN(pw) && isNaN(pm)) {
      let p = g("price");
      if (isNaN(p) && g("sum") > 0 && g("qty") > 0) p = g("sum") / g("qty");
      if (isNaN(p)) continue;
      pw = p; pm = 0; split = false;
    }
    pw = isNaN(pw) ? 0 : pw; pm = isNaN(pm) ? 0 : pm;
    if (pw + pm <= 0) continue;
    out.push({name, unit: m.unit != null ? String(row[m.unit] ?? "").trim() : "", pw, pm, split, src: fileName});
  }
  return out;
}

async function handleFiles(kind, files) {
  const st = $("#fstat"); const say = (t, err) => { if (st) { st.textContent = t; st.className = "status" + (err ? " err" : ""); } };
  if (!files.length) return;
  try {
    if (kind === "vor") {
      const f = files[0]; say("Читаю ведомость…");
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, {type: "array", cellFormula: true});
      leaveDemo();
      setVorFromWorkbook(S, wb, f.name, ab2b64(buf));
      S.checks = null; S.missing = null;
      save(); render(); say(S.vor.auto ? "Ведомость загружена, колонки определены автоматически. Перейдите к шагу 3." : "Ведомость загружена. Колонки не определились — настройте их на шаге 3.");
    } else if (kind === "tz") {
      const f = files[0];
      if (!/\.docx$/i.test(f.name)) return say("Нужен файл .docx. Старый формат .doc откройте в Word и сохраните как .docx.", true);
      say("Извлекаю текст ТЗ…");
      const r = await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()});
      leaveDemo();
      S.tz = {name: f.name, text: r.value}; S.reqs = null; save(); render(); say("ТЗ загружено.");
    } else if (kind === "pdf") {
      leaveDemo();
      for (const f of files) {
        say("Читаю " + f.name + "…");
        const doc = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
        const texts = [];
        for (let i = 1; i <= doc.numPages; i++) {
          const pg = await doc.getPage(i); const tc = await pg.getTextContent();
          texts.push(tc.items.map(x => x.str).join(" ").replace(/\s+/g, " ").slice(0, 12000));
        }
        PDFDOCS[f.name] = doc;
        S.pdfs = S.pdfs.filter(p => p.name !== f.name).concat([{name: f.name, pages: doc.numPages, texts}]);
      }
      S.checks = null; save(); render(); say("Чертежи загружены.");
    } else if (kind === "hist") {
      leaveDemo();
      let added = 0;
      for (const f of files) {
        say("Разбираю " + f.name + "…");
        try {
          const wb = XLSX.read(await f.arrayBuffer(), {type: "array"});
          let items = [];
          for (const sn of wb.SheetNames) { const {rows} = sheetRows(wb.Sheets[sn]); const lay = detectLayout(rows); if (lay && lay.map.name != null) items = items.concat(historyFromRows(rows, lay, f.name)); }

function rowsSnippet(rows, n = 30) {
  return rows.slice(0, n).map((r, i) => `R${i}: ` + (r || []).map((c, j) => c === "" ? null : `C${j}=${String(c).slice(0, 60).replace(/\s+/g, " ")}`).filter(Boolean).join(" | ")).join("\n");
}
async function aiLayout(rows) {
  const res = await AI.json(`Ниже первые строки листа Excel со строительной ведомостью или коммерческим предложением. Rn — номер строки (с 0), Cn — номер колонки (с 0).
Определи строку заголовков, первую строку данных и номера колонок:
num (№ п/п), name (наименование работ/материалов), unit (ед. изм.), qty (количество/объём), pw (цена работ за единицу), pm (цена материалов за единицу), price (общая цена за единицу, если цены не разделены), sum (сумма/стоимость всего).
Если колонки нет — null. Ничего не придумывай.
Ответ — только JSON: {"headerRow":3,"dataStart":4,"columns":{"num":0,"name":1,"unit":2,"qty":3,"pw":null,"pm":null,"price":4,"sum":5}}

${rowsSnippet(rows)}`, {modelTier: "quick"});
  if (!res || typeof res.headerRow !== "number" || !res.columns) throw {message: "неожиданный ответ"};
  const map = {};
  for (const [k] of FIELDS) { const v = res.columns[k]; if (typeof v === "number" && v >= 0) map[k] = v; }
  return {headerRow: res.headerRow, dataStart: typeof res.dataStart === "number" ? res.dataStart : res.headerRow + 1, map};
}
async function aiHistory(wb, fileName) {
  let items = [];
  for (const sn of wb.SheetNames.slice(0, 5)) {
    const {rows} = sheetRows(wb.Sheets[sn]);

    try { const lay = await aiLayout(rows); if (lay.map.name != null) items = items.concat(historyFromRows(rows, lay, fileName)); } catch (e) {}

}

async function renderPage(doc, i, canvas, maxSide) {
  const pg = await doc.getPage(i);
  const v1 = pg.getViewport({scale: 1});
  const sc = Math.min(3, maxSide / Math.max(v1.width, v1.height));
  const vp = pg.getViewport({scale: sc});
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await pg.render({canvasContext: ctx, viewport: vp}).promise;
}

    <button class="btn" type="button" id="m_acc" ${ai ? "" : "disabled"}>Принять все «та же позиция» с уверенностью ≥ 80%</button>
  </div>
  <div class="status" id="m_st"></div>
  <div class="row" style="justify-content:space-between;margin:6px 0 4px"><span>Подтверждено <b>${ok}</b> из ${pos.length} · предложено ИИ: ${ai} · требует проверки: ${chk}</span><span class="row"><span class="badge b-ok">подтверждено</span><span class="badge b-ai">предложение ИИ</span><span class="badge b-warn">проверить</span></span></div>
  <div class="prog"><i style="width:${pos.length ? ok / pos.length * 100 : 0}%"></i></div>
  </div>
  <div class="card" style="padding:0"><div class="tbl" style="border:0;max-height:70vh"><table>
  <tr><th>№</th><th>Наименование</th><th>Ед.</th><th class="num">Кол-во</th><th class="num">Цена работ</th><th class="num">Цена матер.</th><th class="num">Сумма</th></tr>
  ${v.positions.map(p => p.type === "sec" ? `<tr class="sec"><td></td><td colspan="6">${esc(p.name)}</td></tr>` : priceRow(p)).join("")}
  </table></div></div>
  <div class="card">${footer(true, true)}</div>`;
  $("#m_go").onclick = runMatch;
  if (MATCH_CTL) { $("#m_go").disabled = true; $("#m_stop").hidden = false; }
  $("#m_stop").onclick = () => MATCH_CTL?.abort();
  $("#m_acc").onclick = () => { posList().forEach(p => { if (p.status === "ai" && p.sug && p.sug.match === "same" && p.sug.conf >= 0.8) acceptSug(p); }); save(); render(); };
  $$("input.cell").forEach(inp => inp.onchange = () => {
    const p = posList().find(x => x.id === inp.dataset.id); const val = num(inp.value);
    p[inp.dataset.k] = isNaN(val) ? null : val;
    p.sug = null;
    if (p.pw != null || p.pm != null) { p.status = "ok"; p.src = "вручную"; } else { p.status = "empty"; p.src = ""; }
    save(); render();
  });
  $$("[data-acc]").forEach(b => b.onclick = () => { acceptSug(posList().find(x => x.id === b.dataset.acc)); save(); render(); });
  $$("[data-rej]").forEach(b => b.onclick = () => { const p = posList().find(x => x.id === b.dataset.rej); p.sug = null; p.status = (p.pw != null || p.pm != null) ? "ok" : "empty"; save(); render(); });
  bindFooter();
}
function priceRow(p) {
  const sum = (p.qty || 0) * ((p.pw || 0) + (p.pm || 0));
  const chk = p.chk && Math.abs(p.chk.diff) > S.settings.threshold ? `<br><span class="badge b-bad" title="${esc(p.chk.source || "")}">по чертежам: ${qtyf(p.chk.qty)} (${p.chk.diff > 0 ? "+" : ""}${nf0.format(r2(p.chk.diff))}%)</span>` : "";
  const srcLine = p.src && p.status === "ok" ? `<br><small class="muted">источник: ${esc(p.src)}</small>` : "";
  let sug = "";
  if (p.sug && p.status !== "ok") {
    const s = p.sug;
    if (s.match === "none" || s.cand == null) sug = `<div class="sug ${s.match}"><span class="t">Нет подходящей позиции в базе</span>${s.note ? `<span class="s">${esc(s.note)}</span>` : ""}<div class="row"><button class="btn sm" type="button" data-rej="${p.id}">Скрыть</button></div></div>`;
    else sug = `<div class="sug ${s.match}"><span class="t">${s.match === "same" ? "Та же позиция" : "Похожая — проверьте"} · ${Math.round(s.conf * 100)}%</span>
      <span>«${esc(s.srcName)}», ${esc(s.srcUnit)}</span>
      <span class="mono">работы ${money(s.pw)} + матер. ${money(s.pm)} за ${esc(p.unit)}</span>
      ${s.factor !== 1 ? `<span class="s">пересчёт ед.: ${esc(s.srcUnit)} → ${esc(p.unit)}, ×${nf0.format(s.factor)}</span>` : ""}
      ${s.split === false ? `<span class="s">в источнике цена не разделена на работы и материалы</span>` : ""}
      ${s.note ? `<span class="s">${esc(s.note)}</span>` : ""}<span class="s">${esc(s.src)}</span>
      <div class="row"><button class="btn sm pri" type="button" data-acc="${p.id}">Принять</button><button class="btn sm" type="button" data-rej="${p.id}">Отклонить</button></div></div>`;
  }
  return `<tr class="st-${p.status}${sug ? " has-sug" : ""}"><td class="rn">${esc(p.num)}</td><td style="min-width:240px">${esc(p.name)}${srcLine}${chk}</td><td>${esc(p.unit)}</td><td class="num">${qtyf(p.qty)}</td>
  <td class="num"><input class="cell" inputmode="decimal" data-id="${p.id}" data-k="pw" value="${p.pw != null ? r2(p.pw) : ""}" aria-label="Цена работ"></td>
  <td class="num"><input class="cell" inputmode="decimal" data-id="${p.id}" data-k="pm" value="${p.pm != null ? r2(p.pm) : ""}" aria-label="Цена материалов"></td>
  <td class="num">${sum ? money(sum) : "—"}</td></tr>${sug ? `<tr class="sugrow st-${p.status}"><td></td><td colspan="6">${sug}</td></tr>` : ""}`;
}
function acceptSug(p) {
  if (!p?.sug || p.sug.cand == null) return;
  p.pw = r2(p.sug.pw); p.pm = r2(p.sug.pm); p.status = "ok"; p.src = "ИИ → " + p.sug.src;
  p.sug = null;
}
async function runMatch() {
  let msg = "", isErr = false;
  const say = (t, err) => { msg = t; isErr = !!err; const el = $("#m_st"); if (el) { el.textContent = t; el.className = "status" + (err ? " err" : ""); } };
  const todo = posList().filter(p => p.status !== "ok");
  if (!todo.length) { say("Все позиции уже расценены."); return; }
  MATCH_CTL = new AbortController(); render();
  const B = 10; let done = 0;
  try {
    for (let i = 0; i < todo.length; i += B) {
      if (MATCH_CTL.signal.aborted) break;
      const batch = todo.slice(i, i + B).map(p => ({p, c: candidatesFor(p)}));
      say(`Подбираю цены: ${done} из ${todo.length}…`);
      let answers = [];
      if (AI) {
        const prompt = `Ты помогаешь инженеру строительной компании расценить ведомость работ по прошлым коммерческим предложениям (рыночные цены компании).
Для каждой позиции ведомости выбери из её кандидатов (К1, К2…) ту запись, которая означает ТУ ЖЕ работу/материал, даже если записана иначе (сокращения, порядок слов, синонимы, «д.», «Ø», «Ду»).
match: "same" — та же позиция; "similar" — отличается существенным параметром (диаметр, сечение, марка, класс, толщина, материал, тип исполнения) — опиши отличие в note; "none" — подходящей нет.
factor — множитель пересчёта цены кандидата в единицу позиции (например кандидат «100 м2», позиция «м2» → 0.01; одинаковые единицы → 1). Если пересчёт невозможен — "none".
Не придумывай цены и позиции — выбирай только из кандидатов.
Ответ — только JSON-массив: [{"id":"p1","cand":2,"match":"same","factor":1,"confidence":0.9,"note":""}]

${batch.map(({p, c}) => `ПОЗИЦИЯ ${p.id}: ${p.name} [${p.unit}]\n${c.length ? c.map((x, j) => `  К${j + 1}: ${S.history[x.i].name} [${S.history[x.i].unit}]`).join("\n") : "  (кандидатов нет)"}`).join("\n\n")}`;
        const res = await AI.json(prompt, {signal: MATCH_CTL.signal});
        answers = Array.isArray(res) ? res : [];
      } else {
        answers = batch.map(({p, c}) => ({id: p.id, cand: c.length && c[0].s > 0.45 ? 1 : null, match: c.length && c[0].s > 0.45 ? "similar" : "none", factor: null, confidence: c[0]?.s || 0, note: "подбор по совпадению слов, без ИИ"}));
      }
      for (const {p, c} of batch) {
        const a = answers.find(x => x && x.id === p.id);
        if (!a) continue;
        const ci = typeof a.cand === "number" ? a.cand - 1 : -1;
        if (a.match === "none" || ci < 0 || !c[ci]) { p.sug = {match: "none", cand: null, note: a.note || ""}; p.status = "check"; continue; }
        const h = S.history[c[ci].i];
        let f = unitFactor(p.unit, h.unit);
        if (f == null) f = typeof a.factor === "number" && a.factor > 0 ? a.factor : null;
        if (f == null) { p.sug = {match: "none", cand: null, note: `Найдена «${h.name}» [${h.unit}], но единицы не пересчитываются в «${p.unit}».`}; p.status = "check"; continue; }
        p.sug = {cand: c[ci].i, match: a.match === "same" ? "same" : "similar", factor: f, conf: Math.max(0, Math.min(1, +a.confidence || 0)),
          note: a.note || "", pw: h.pw * f, pm: h.pm * f, srcName: h.name, srcUnit: h.unit, src: h.src, split: h.split};
        p.status = p.sug.match === "same" ? "ai" : "check";
      }
      done += batch.length; save(); if (S.step === 4) render(); say(`Подбираю цены: ${done} из ${todo.length}…`);
    }
    msg = MATCH_CTL.signal.aborted ? "Остановлено." : "Готово. Проверьте предложения и примите подходящие."; isErr = false;
  } catch (e) { msg = e?.code === "cancelled" ? "Остановлено." : aiErr(e); isErr = e?.code !== "cancelled"; }
  MATCH_CTL = null; save(); render(); say(msg, isErr);
}

/* ---------- шаг 6 ---------- */
function totals() {
  const s = S.settings, pos = posList();
  let w = 0, m = 0;
  for (const p of pos) { w += (p.qty || 0) * (p.pw || 0); m += (p.qty || 0) * (p.pm || 0); }
  const direct = w + m, k = (1 + s.oh / 100) * (1 + s.pr / 100) * (1 - s.disc / 100);
  const oh = direct * s.oh / 100, pr = (direct + oh) * s.pr / 100, disc = (direct + oh + pr) * s.disc / 100;
  const net = direct * k, vat = net * s.vat / 100;
  return {w, m, direct, oh, pr, disc, net, vat, gross: net + vat, k, unpriced: pos.filter(p => p.status !== "ok").length};
}
function stTotal() {
  const s = S.settings, T = totals(), nm = num(S.tender.nmck);
  const red = nm > 0 ? (1 - T.gross / nm) * 100 : null;
  const bySec = []; let cur = null;
  for (const p of (S.vor?.positions || [])) { if (p.type === "sec") { cur = {name: p.name, sum: 0}; bySec.push(cur); } else { if (!cur) { cur = {name: "Без раздела", sum: 0}; bySec.push(cur); } cur.sum += (p.qty || 0) * ((p.pw || 0) + (p.pm || 0)); } }
  $("#main").innerHTML = `<div class="card"><h1>Итоги и выгрузка</h1>
  ${T.unpriced ? `<p class="status err">Не подтверждено позиций: ${T.unpriced}. Они войдут в КП с текущими ценами (или нулевыми).</p>` : ""}
  <div class="kpis" style="margin:10px 0 16px">
    <div class="kpi"><small>Прямые затраты</small><b>${money(T.direct)}</b></div>
    <div class="kpi"><small>Итого без НДС</small><b>${money(T.net)}</b></div>
    <div class="kpi"><small>Всего с НДС</small><b>${money(T.gross)}</b></div>
    <div class="kpi"><small>Снижение от НМЦК</small><b>${red == null ? "—" : nf0.format(r2(red)) + "%"}</b>${red != null && red > 25 ? `<span class="badge b-warn">проверьте риск демпинга</span>` : red != null && red < 0 ? `<span class="badge b-bad">выше НМЦК</span>` : ""}</div>
  </div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
    <label class="f">Накладные, %<input type="number" step="0.1" id="s_oh" value="${s.oh}"></label>
    <label class="f">Прибыль, %<input type="number" step="0.1" id="s_pr" value="${s.pr}"></label>
    <label class="f">Скидка, %<input type="number" step="0.1" id="s_disc" value="${s.disc}"></label>
    <label class="f">НДС, %<input type="number" step="0.1" id="s_vat" value="${s.vat}"></label>
  </div>
  <div class="tbl" style="margin-top:14px"><table>
    <tr><th>Статья</th><th class="num">Сумма, руб.</th></tr>
    <tr><td>Работы</td><td class="num">${money(T.w)}</td></tr>
    <tr><td>Материалы и оборудование</td><td class="num">${money(T.m)}</td></tr>
    <tr><td>Накладные расходы (${s.oh}% от прямых)</td><td class="num">${money(T.oh)}</td></tr>
    <tr><td>Прибыль (${s.pr}%)</td><td class="num">${money(T.pr)}</td></tr>
    ${s.disc ? `<tr><td>Скидка (${s.disc}%)</td><td class="num">−${money(T.disc)}</td></tr>` : ""}
    <tr class="sec"><td>Итого без НДС</td><td class="num">${money(T.net)}</td></tr>
    <tr><td>НДС ${s.vat}%</td><td class="num">${money(T.vat)}</td></tr>
    <tr class="sec"><td>Всего с НДС</td><td class="num">${money(T.gross)}</td></tr>
  </table></div>
  <h2 style="margin-top:16px">По разделам (прямые затраты)</h2>
  <div class="tbl"><table><tr><th>Раздел</th><th class="num">Сумма, руб.</th></tr>${bySec.map(b => `<tr><td>${esc(b.name)}</td><td class="num">${money(b.sum)}</td></tr>`).join("")}</table></div>
  </div>
  <div class="card"><h2>Выгрузка</h2>
  <label class="row" style="margin-bottom:10px"><input type="checkbox" id="s_mk" ${s.markupIntoPrices ? "checked" : ""}> Распределить накладные, прибыль и скидку в цены позиций (коэффициент ×${nf0.format(r2(T.k * 1000) / 1000)})</label>
  <div class="row"><button class="btn pri" type="button" id="x_vor" ${S.vor ? "" : "disabled"}>Скачать заполненную ведомость (.xlsx)</button><span class="status" id="x_st">${DL ? "" : "Сохранение файлов недоступно в этом просмотре."}</span></div>
  <p class="muted" style="margin-top:10px">Файл повторяет форму ведомости заказчика: цены и суммы записаны в её колонки, внизу добавлены строки «Итого без НДС», «НДС» и «Всего с НДС», а также лист «Сводка КП».</p>
  ${footer(true, false)}</div>`;
  for (const k of ["oh", "pr", "disc", "vat"]) $("#s_" + k).onchange = e => { S.settings[k] = +e.target.value || 0; save(); render(); };
  $("#s_mk").onchange = e => { S.settings.markupIntoPrices = e.target.checked; save(); };
  $("#x_vor").onclick = exportVor;
  bindFooter();
}
async function exportVor() {
  const st = $("#x_st");
  if (!DL) { st.textContent = "Сохранение файлов недоступно в этом просмотре."; return; }
  try {
    const v = S.vor, T = totals(), k = S.settings.markupIntoPrices ? T.k : 1;
    const wb = XLSX.read(v.b64, {type: "base64", cellFormula: true, cellStyles: true});
    const ws = wb.Sheets[v.sheet]; const rg = XLSX.utils.decode_range(ws["!ref"]);
    const {r0, c0} = sheetRows(ws);
    const m = {...v.map}; let extra = rg.e.c + 1;
    const hdr = (c, label) => { ws[XLSX.utils.encode_cell({r: r0 + v.headerRow, c: c0 + c})] = {t: "s", v: label}; };
    if (m.pw == null && m.pm == null && m.price == null) { m.price = extra++ - c0; hdr(m.price, "Цена за ед., руб."); }
    if (m.sum == null) { m.sum = extra++ - c0; hdr(m.sum, "Сумма, руб."); }
    const put = (r, c, val) => {
      const a = XLSX.utils.encode_cell({r: r0 + r, c: c0 + c}); const old = ws[a] || {};
      ws[a] = {t: "n", v: r2(val), z: "#,##0.00"}; if (old.f && c === m.sum) ws[a].f = old.f; if (old.s) ws[a].s = old.s;
    };
    let lastRow = 0, total = 0;
    for (const p of posList()) {
      const pw = r2((p.pw || 0) * k), pm = r2((p.pm || 0) * k);
      if (m.pw != null) put(p.row, m.pw, pw);
      if (m.pm != null) put(p.row, m.pm, pm);
      if (m.pw == null && m.pm == null) put(p.row, m.price, pw + pm);
      else if (m.price != null) put(p.row, m.price, pw + pm);
      const sum = r2((pw + pm) * (p.qty || 0)); put(p.row, m.sum, sum); total += sum;
      lastRow = Math.max(lastRow, p.row);
    }
    const net = S.settings.markupIntoPrices ? total : T.net, vat = net * S.settings.vat / 100;
    const nameCol = m.name ?? 1;
    const lines = [["Итого без НДС", net], [`НДС ${S.settings.vat}%`, vat], ["Всего с НДС", net + vat]];
    const endRow = Math.max(lastRow, rg.e.r - r0) + 2;
    lines.forEach(([l, val], i) => { ws[XLSX.utils.encode_cell({r: r0 + endRow + i, c: c0 + nameCol})] = {t: "s", v: l}; put(endRow + i, m.sum, val); });
    rg.e.r = Math.max(rg.e.r, r0 + endRow + lines.length); rg.e.c = Math.max(rg.e.c, extra - 1);
    ws["!ref"] = XLSX.utils.encode_range(rg);
    const t = S.tender;
    const sum = [["Сводка коммерческого предложения"], [], ["Заказчик", t.customer], ["Предмет", t.subject], ["Номер закупки", t.number], ["Участник", t.company], ["Ответственный", t.owner], ["Срок подачи", t.deadline], [],
      ["Работы, руб.", r2(T.w)], ["Материалы, руб.", r2(T.m)], ["Прямые затраты, руб.", r2(T.direct)], [`Накладные ${S.settings.oh}%`, r2(T.oh)], [`Прибыль ${S.settings.pr}%`, r2(T.pr)], [`Скидка ${S.settings.disc}%`, r2(T.disc)],
      ["Итого без НДС", r2(T.net)], [`НДС ${S.settings.vat}%`, r2(T.vat)], ["Всего с НДС", r2(T.gross)], ["НМЦК", num(t.nmck) || ""]];
    const sws = XLSX.utils.aoa_to_sheet(sum); sws["!cols"] = [{wch: 28}, {wch: 60}];
    const sn = "Сводка КП"; if (wb.Sheets[sn]) { delete wb.Sheets[sn]; wb.SheetNames = wb.SheetNames.filter(x => x !== sn); }
    XLSX.utils.book_append_sheet(wb, sws, sn);
    const out = XLSX.write(wb, {type: "array", bookType: "xlsx"});
    const fname = "КП_" + v.fileName.replace(/\.(xlsx|xls|xlsm)$/i, "") + ".xlsx";
    st.className = "status"; st.textContent = "Подтвердите сохранение файла…";
    await DL.save({filename: fname, data: new Blob([out])});
    st.textContent = "Файл сохранён: " + fname;
  } catch (e) { st.className = "status err"; st.textContent = e?.code === "declined" ? "Сохранение отменено." : "Не удалось сформировать файл: " + (e?.message || e); }
}

  <div class="row end"><button class="btn" type="button" id="mm_c">Отмена</button><button class="btn" type="button" id="mm_d">Открыть демо-пример</button><button class="btn pri" type="button" id="mm_ok">Новый тендер</button></div></div>`;

/* ---------- старт ---------- */
S = load() || demoState();
if (S.vor?.b64) { try { VORWB = XLSX.read(S.vor.b64, {type: "base64", cellFormula: true}); } catch (e) {} }
render();
</script>
